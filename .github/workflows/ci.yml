name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore RooviApp.Identity.sln
      - run: dotnet build RooviApp.Identity.sln --configuration Release --no-restore
      - run: dotnet test ATProto.Primitives.Tests/ATProto.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName!~Integration" --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: TestResults/*.trx
