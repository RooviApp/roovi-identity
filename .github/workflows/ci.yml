name: Build and test

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-tests:
    name: All tests (${{ matrix.provider }}, pair ${{ matrix.pair }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pair: [1, 2, 3, 4, 5]
        provider: [github, blacksmith]
        include:
          - provider: github
            runner: ubuntu-26.04
          - provider: blacksmith
            runner: blacksmith-4vcpu-ubuntu-2604
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 8e84c8e823b45fbbc25757168216fcb874f98e1a
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Verify Docker
        run: docker info
      - run: dotnet restore RooviApp.Identity.sln
      - run: dotnet build RooviApp.Identity.sln --configuration Release --no-restore
      - name: Run every test
        run: >-
          dotnet test --solution RooviApp.Identity.sln --configuration Release --no-build
          --fail-skips on --minimum-expected-tests 185 --timeout 5m
          --report-trx --report-trx-filename all-tests.trx --results-directory TestResults
          --coverlet --coverlet-output-format cobertura
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.provider }}-${{ matrix.pair }}
          path: TestResults/
          if-no-files-found: error
